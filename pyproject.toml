[project]
name = "course.md"
version = "0.1.0"
description = "A reusable Python package for building data-driven course repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Chris Timperley"}
]
keywords = ["mkdocs", "education", "course", "website"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Documentation",
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
mkdocs = [
    "mkdocs>=1.6.0",
]
canvas = [
    "requests>=2.32.0",
]
all = [
    "mkdocs>=1.6.0",
    "requests>=2.32.0",
]
dev = [
    "mkdocs>=1.6.0",
    "requests>=2.32.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-pyyaml>=6.0.12.20260408",
]

[project.urls]
Homepage = "https://github.com/ChrisTimperley/course.md"
Repository = "https://github.com/ChrisTimperley/course.md"
Documentation = "https://github.com/ChrisTimperley/course.md#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coursemd"]

[project.scripts]
coursemd = "coursemd.cli:main"

[project.entry-points."mkdocs.plugins"]
coursemd = "coursemd.adapters.mkdocs.plugin:CoursemdPlugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["frontmatter"]
ignore_missing_imports = true
